services:
  mysql:
    image: mysql:8.4
    container_name: auto_admin_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: auto_admin_test
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  adminer:
    image: adminer
    container_name: auto_admin_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - mysql

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: auto_admin_client
    restart: unless-stopped
    ports:
      - "5177:5173"
    volumes:
      - .:/app
      - client_workspace_root_modules:/app/node_modules
      - client_workspace_client_modules:/app/client/node_modules
      - client_workspace_server_modules:/app/server/node_modules
      - client_workspace_contracts_modules:/app/packages/contracts/node_modules
    environment:
      - NODE_ENV=development

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: auto_admin_server 
    restart: unless-stopped
    ports:
      - "5180:5174"
    volumes:
      - .:/app
      - server_workspace_root_modules:/app/node_modules
      - server_workspace_client_modules:/app/client/node_modules
      - server_workspace_server_modules:/app/server/node_modules
      - server_workspace_contracts_modules:/app/packages/contracts/node_modules
    environment:
      - Auto_Admin__PORT=5174
      - Auto_Admin__HOST=0.0.0.0
      - Auto_Admin__NODE_ENV=development
    depends_on:
      - mysql
    env_file: ./server/.env

volumes:
  mysql_data:
  client_workspace_root_modules:
  client_workspace_client_modules:
  client_workspace_server_modules:
  client_workspace_contracts_modules:
  server_workspace_root_modules:
  server_workspace_client_modules:
  server_workspace_server_modules:
  server_workspace_contracts_modules:
